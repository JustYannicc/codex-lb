name: PR1954 core3 diagnostic

on:
  push:
    branches: ["chore/pr1954-core3-diagnostic-20260908"]
    paths:
      - ".github/workflows/pr1954-core3-diagnostic.yml"
      - ".github/scripts/pr1954_core3_diagnostic.py"

permissions:
  contents: read

jobs:
  diagnostic:
    name: Diagnostic only, exact c9aeb6 core3
    if: github.repository == 'JustYannicc/codex-lb'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Initialize dedicated database environment
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_db_url="sqlite+aiosqlite:///$RUNNER_TEMP/pr1954-core3/tests.db"
          mkdir -p "$RUNNER_TEMP/pr1954-core3"
          echo "CODEX_LB_DATABASE_URL=$diagnostic_db_url" >> "$GITHUB_ENV"
          echo "CODEX_LB_TEST_DATABASE_URL=$diagnostic_db_url" >> "$GITHUB_ENV"

      - name: Checkout diagnostic runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: diagnostics
          persist-credentials: false
          sparse-checkout: .github/scripts/pr1954_core3_diagnostic.py
          sparse-checkout-cone-mode: false

      - name: Checkout exact failed source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c9aeb6b9dd5de1b609274cd8544b1efea59272cd
          path: candidate
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.10"
          python-version: "3.13.15"
          enable-cache: false
          working-directory: candidate

      - name: Verify source and prepare frozen dependencies
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$(git rev-parse HEAD)" = c9aeb6b9dd5de1b609274cd8544b1efea59272cd
          test "$(git rev-parse 'HEAD^{tree}')" = 7f7b8620fc82373af67bd7ae67e1d8dbf116e5f1
          git diff --exit-code
          make frontend-build
          uv sync --dev --frozen
          uv --version
          bun --version
          uname -srmo

      - name: Run guarded verbose core3 diagnostic
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python ../diagnostics/.github/scripts/pr1954_core3_diagnostic.py
